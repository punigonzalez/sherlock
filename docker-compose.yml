services:
  postgres:
    image: postgres:16-alpine
    container_name: logdetective-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logdetective}
      POSTGRES_USER: ${POSTGRES_USER:-logdetective}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or a .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - logdetective_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  logdetective_pgdata:
