spring:
  application:
    name: logdetective
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logdetective}
    username: ${SPRING_DATASOURCE_USERNAME:logdetective}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Optional Spring AI OpenAI (never required for build/tests).
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

server:
  # Local MVP: bind loopback only (override with SERVER_ADDRESS if needed).
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

# Local file ingestion (paths via env; no secrets). Disabled by default.
logdetective:
  investigation:
    # noop (default) | fake | openai
    provider: ${LOGDETECTIVE_INVESTIGATION_PROVIDER:noop}
    max-tool-calls: ${LOGDETECTIVE_INVESTIGATION_MAX_TOOL_CALLS:8}
    timeout-seconds: ${LOGDETECTIVE_INVESTIGATION_TIMEOUT_SECONDS:30}
    max-log-chars: ${LOGDETECTIVE_INVESTIGATION_MAX_LOG_CHARS:2000}
    tool-row-limit: ${LOGDETECTIVE_INVESTIGATION_TOOL_ROW_LIMIT:20}
  detection:
    enabled: ${LOGDETECTIVE_DETECTION_ENABLED:true}
    threshold:
      window-seconds: ${LOGDETECTIVE_THRESHOLD_WINDOW_SECONDS:60}
      min-error-count: ${LOGDETECTIVE_THRESHOLD_MIN_ERRORS:5}
    spike:
      window-seconds: ${LOGDETECTIVE_SPIKE_WINDOW_SECONDS:60}
      baseline-windows: ${LOGDETECTIVE_SPIKE_BASELINE_WINDOWS:3}
      multiplier: ${LOGDETECTIVE_SPIKE_MULTIPLIER:3.0}
      min-error-count: ${LOGDETECTIVE_SPIKE_MIN_ERRORS:3}
    correlation:
      trace-lookback-seconds: ${LOGDETECTIVE_TRACE_LOOKBACK_SECONDS:300}
      temporal-window-seconds: ${LOGDETECTIVE_TEMPORAL_WINDOW_SECONDS:30}
  gcp-logging:
    enabled: ${LOGDETECTIVE_GCP_LOGGING_ENABLED:false}
    source-id: ${LOGDETECTIVE_GCP_SOURCE_ID:gcp-logging}
    project-id: ${GCP_PROJECT_ID:}
    filter: ${LOGDETECTIVE_GCP_FILTER:severity>=ERROR}
    page-size: ${LOGDETECTIVE_GCP_PAGE_SIZE:50}
    poll-interval-ms: ${LOGDETECTIVE_GCP_POLL_INTERVAL_MS:10000}
    historical-lookback: ${LOGDETECTIVE_GCP_HISTORICAL_LOOKBACK:PT1H}
    max-pages-per-poll: ${LOGDETECTIVE_GCP_MAX_PAGES_PER_POLL:3}
  ingestion:
    enabled: ${LOGDETECTIVE_INGESTION_ENABLED:false}
    batch-size: ${LOGDETECTIVE_INGESTION_BATCH_SIZE:100}
    poll-interval-ms: ${LOGDETECTIVE_INGESTION_POLL_INTERVAL_MS:2000}
    # API/CLI paths must resolve under this directory (traversal protection).
    allowlist-base-dir: ${LOGDETECTIVE_ALLOWLIST_BASE_DIR:./logs}
    sources:
      - id: ${LOGDETECTIVE_FILE_SOURCE_ID:app-log}
        type: FILE
        path: ${LOGDETECTIVE_FILE_SOURCE_PATH:./logs/app.log}
        encoding: ${LOGDETECTIVE_FILE_SOURCE_ENCODING:UTF-8}
        enabled: ${LOGDETECTIVE_FILE_SOURCE_ENABLED:true}
